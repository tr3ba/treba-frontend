name: Frontend Docker Build and Push to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: treba-frontend

jobs:
  docker:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Validate storefront and workspace
        run: |
          npm ci
          npm run lint
          npm run build
          node --test tests/*.test.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::019066823315:role/treba-frontend-ecr-publish
          role-session-name: treba-frontend-publish-${{ github.run_id }}
          unset-current-credentials: true
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify frontend publish identity
        shell: bash
        run: |
          set -euo pipefail
          caller_arn="$(aws sts get-caller-identity --query Arn --output text)"
          [[ "$caller_arn" == arn:aws:sts::019066823315:assumed-role/treba-frontend-ecr-publish/* ]]
          printf 'AWS caller: %s\n' "$caller_arn"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          API_URL=$(aws ssm get-parameter \
            --name "/treba/frontend/NEXT_PUBLIC_API_URL" \
            --query "Parameter.Value" \
            --output text)

          USE_MOCKS=$(aws ssm get-parameter \
            --name "/treba/frontend/NEXT_PUBLIC_USE_MOCKS" \
            --query "Parameter.Value" \
            --output text)

          docker build \
            -f docker/Dockerfile.frontend \
            --build-arg NEXT_PUBLIC_API_URL="$API_URL" \
            --build-arg NEXT_PUBLIC_USE_MOCKS="$USE_MOCKS" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            docker tag \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
              $ECR_REGISTRY/$ECR_REPOSITORY:latest

            docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          fi