name: Frontend Docker Build and Push to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: treba-frontend

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          API_URL=$(aws ssm get-parameter \
            --name "/treba/frontend/NEXT_PUBLIC_API_URL" \
            --query "Parameter.Value" \
            --output text)

          USE_MOCKS=$(aws ssm get-parameter \
            --name "/treba/frontend/NEXT_PUBLIC_USE_MOCKS" \
            --query "Parameter.Value" \
            --output text)

          docker build \
            -f docker/Dockerfile.frontend \
            --build-arg NEXT_PUBLIC_API_URL="$API_URL" \
            --build-arg NEXT_PUBLIC_USE_MOCKS="$USE_MOCKS" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            docker tag \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
              $ECR_REGISTRY/$ECR_REPOSITORY:latest

            docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          fi