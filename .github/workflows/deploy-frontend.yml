name: Deploy Frontend to EC2

on:
  workflow_run:
    workflows:
      - Frontend Docker Build and Push to ECR
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_revision:
        description: Existing reviewed main commit SHA (empty uses the selected revision)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: treba-frontend-ec2
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  EC2_INSTANCE_ID: i-0d469acaa36d8d39d
  ECR_REGISTRY: 019066823315.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPOSITORY: treba-frontend

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy frontend through AWS SSM
        env:
          IMAGE_REVISION: ${{ inputs.image_revision || github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$IMAGE_REVISION" origin/main
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          revision = os.environ['IMAGE_REVISION']
          image = os.environ['ECR_REGISTRY'] + '/' + os.environ['ECR_REPOSITORY'] + ':' + revision
          script = Path('scripts/deploy-frontend.sh').read_text()
          maintenance = Path('scripts/retain-frontend-rollbacks.py').read_text()
          command = "set -e\npython3 <<'TREBA_ROLLBACK_RETENTION'\n" + maintenance + "\nTREBA_ROLLBACK_RETENTION\n"
          command += 'bash -s -- ' + image + ' ' + revision + " <<'TREBA_FRONTEND'\n" + script + '\nTREBA_FRONTEND'
          Path('ssm-parameters.json').write_text(json.dumps({'commands': [command], 'executionTimeout': ['600']}))
          PY
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Treba frontend from ECR" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 5
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json > ssm-report.json
          cat ssm-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          if json.loads(Path('ssm-report.json').read_text())['Status'] != 'Success':
              raise SystemExit('Frontend deployment failed; inspect the SSM report and rollback result above.')
          PY
