
name: Stage 5 Frontend ECR Build

on:
  push:
    branches:
      - devops/stage5-frontend-ecr
    paths:
      - .github/workflows/stage5-frontend-ecr.yml

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: treba-frontend
  IMAGE_TAG: stage5-d57e2d0eabb9

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verified frontend version
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: d57e2d0eabb93b643d9613d653fc624c0d5fab79

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build and publish Stage 5 image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail

          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          test "$ACCOUNT" = "019066823315"

          test "$ECR_REGISTRY" = "019066823315.dkr.ecr.eu-west-1.amazonaws.com"

          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            >/dev/null 2>&1; then
            echo "Stage 5 tag already exists; refusing overwrite"
            exit 1
          fi

          docker build \
            -f docker/Dockerfile.frontend \
            --build-arg NEXT_PUBLIC_API_URL="http://localhost:8080" \
            --build-arg NEXT_PUBLIC_USE_MOCKS="false" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text
